<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gestión de Tareas</title>
  <link rel="icon" href="logo.jpg">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #4facfe, #00f2fe);
      color: #333;
    }

    .container {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .header {
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 15px;
      text-align: center;
    }

    .logo {
      height: 50px;
    }

    .main {
      flex: 1;
      padding: 20px;
    }

    .formulario {
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    input, button {
      padding: 10px;
      font-size: 1rem;
    }

    input {
      flex: 1;
      min-width: 150px;
    }

    button {
      background: #0077b6;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      padding: 10px 15px;
    }

    button:hover {
      background: #023e8a;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    .enlaces a {
      display: inline-block;
      margin: 5px;
      color: #0077b6;
      text-decoration: none;
    }

    .enlaces a:hover {
      text-decoration: underline;
    }

    .footer {
      background: rgba(0,0,0,0.7);
      color: white;
      text-align: center;
      padding: 10px;
    }

    /* 📱 Vista móvil */
    @media (max-width: 600px) {
      .formulario {
        flex-direction: column;
        align-items: stretch;
      }

      input {
        width: 100%;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <img src="logo.jpg" alt="Logo" class="logo">
      <h1>Gestión de Tareas</h1>
    </header>

    <main class="main">
      <!-- Formulario -->
      <div class="formulario">
        <input id="nombre" placeholder="Nombre de la tarea">
        <input id="descripcion" placeholder="Descripción">
        <button onclick="agregarTarea()">Agregar</button>
      </div>

      <!-- Lista -->
      <h2>Lista de tareas</h2>
      <ul id="lista"></ul>

      <!-- Enlaces externos -->
      <div class="enlaces">
        <h3>Recursos en la nube</h3>
        <a href="https://drive.google.com" target="_blank">Google Drive</a>
        <a href="https://www.dropbox.com" target="_blank">Dropbox</a>
        <a href="https://www.youtube.com" target="_blank">YouTube</a>
      </div>
    </main>

    <footer class="footer">
      <p>Curso: Conceptualización de servicios en la nube</p>
      <p>Nombre: Valeria Arquieta Gonzalez</p>
    </footer>
  </div>

  <script>
    const API_URL = "/tareas";

    async function cargarTareas() {
      const res = await fetch(API_URL);
      const data = await res.json();
      document.getElementById('lista').innerHTML = data.map(t => `
        <li>
          <strong>${t.nombre}</strong>: ${t.descripcion}
          <button onclick="editarTarea(${t.id})">Editar</button>
          <button onclick="eliminarTarea(${t.id})">Eliminar</button>
        </li>
      `).join('');
    }

    async function agregarTarea() {
      const nombre = document.getElementById('nombre').value;
      const descripcion = document.getElementById('descripcion').value;
      await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nombre, descripcion })
      });
      cargarTareas();
    }

    async function editarTarea(id) {
      const nuevoNombre = prompt("Nuevo nombre:");
      const nuevaDescripcion = prompt("Nueva descripción:");
      await fetch(`${API_URL}/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nombre: nuevoNombre, descripcion: nuevaDescripcion })
      });
      cargarTareas();
    }

    async function eliminarTarea(id) {
      await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
      cargarTareas();
    }

    cargarTareas();
  </script>
</body>
</html>
