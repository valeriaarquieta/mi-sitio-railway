<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi Sitio en Railway</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url('https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8Zm9uZG8lMjBkZSUyMHBhbnRhbGxhJTIwZmxvcmFsfGVufDB8fDB8fHww') no-repeat center center fixed;
      background-size: cover;
    }

    .container {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .header {
      background-color: rgba(0, 0, 0, 0.6);
      padding: 10px;
    }

    .logo {
      height: 50px;
    }

    .main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .main a {
      font-size: 1.2rem;
      color: white;
      text-decoration: none;
      background-color: rgba(0, 0, 0, 0.7);
      padding: 10px 20px;
      border-radius: 5px;
    }

    .main a:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }

    .footer {
      background-color: rgba(0, 0, 0, 0.6);
      color: white;
      text-align: center;
      padding: 15px;
    }
  </style>
  <link rel="icon" href="logo.jpg">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <img src="logo.jpg" alt="Logo del sitio" class="logo">
    </header>

    <!-- Body -->
    <main class="main">
      <a href="https://www.netflix.com/watch/80057281" target="_blank">
        Ver video en streaming
      </a>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <p>Curso: Conceptualización de servicios en la nube</p>
      <p>Nombre: Valeria Arquieta Gonzalez</p>
      <p>Código: 224065146</p>
      <p>Correo: valeria.arquietag@gmail.com</p>
    </footer>
  </div>
</body>
</html>
